# The Rust bot and its crates: build everything with `cargo build --release` here (binaries in
# native/target/release). See README "Rust bot".
[workspace]
resolver = "2"
members = ["bot", "kernel", "simcore", "rumbot", "pycompat", "typesafe"]

[profile.release]
lto = true
codegen-units = 1

[profile.test]
opt-level = 2
