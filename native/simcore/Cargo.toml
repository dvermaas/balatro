[package]
name = "simcore"
version = "0.1.0"
edition = "2021"
description = "Pure-Rust forecast core: state description, rollout policy, play_horizon on rumbot-sim (no PyO3)"
license = "MIT"

[lib]
name = "simcore"

[dependencies]
jev_kernel = { path = "../kernel" }
rumbot_sim = { path = "../rumbot" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = true
codegen-units = 1
