[package]
name = "jev_sim"
version = "0.1.0"
edition = "2021"
description = "Forecast rollouts on rumbot-sim (stage B of the Rust port): state bridge, rollout.Policy and play_horizon"
license = "MIT"

[lib]
name = "jev_sim"
crate-type = ["cdylib"]

[dependencies]
jev_kernel = { path = "../kernel" }
rumbot_sim = { path = "../rumbot" }
simcore = { path = "../simcore" }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py312"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }  # exact floats: joker xMults must arrive bit for bit

[profile.release]
lto = true
codegen-units = 1
